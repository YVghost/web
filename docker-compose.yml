version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://marketcampus_user:marketcampus_password@db:5432/marketcampus_db
      - SECRET_KEY=tu-clave-secreta-aqui-cambiar-en-produccion
    depends_on:
      - db
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: marketcampus_db
      POSTGRES_USER: marketcampus_user
      POSTGRES_PASSWORD: marketcampus_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  static_volume:
  media_volume: